services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PUBLISH_HOST:-127.0.0.1}:${BACKEND_PUBLISH_PORT:-8000}:8000"
    volumes:
      - db-data:/app/app/ai_implementation/data
      - budget-storage:/app/data/budget-storage
    environment:
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://0.0.0.0,http://0.0.0.0:80}
      # Local default: API-key auth. Production can switch to Vertex/ADC by
      # setting GOOGLE_GENAI_USE_ENTERPRISE=true and providing project/location.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GOOGLE_GENAI_USE_ENTERPRISE=${GOOGLE_GENAI_USE_ENTERPRISE:-false}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Phase 11 disclosure-package output. Default in config.py resolves to
      # /app/app/data/budget-storage; pin it here so it lines up with the
      # `budget-storage` volume mount above (and survives container restarts).
      - BUDGET_STORAGE_ROOT=${BUDGET_STORAGE_ROOT:-/app/data/budget-storage}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${FRONTEND_PUBLISH_HOST:-127.0.0.1}:${FRONTEND_PUBLISH_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db-data:
  budget-storage:
