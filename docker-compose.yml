services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/app/ai_implementation/data
      - budget-storage:/app/data/budget-storage
    environment:
      - ALLOW_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://0.0.0.0,http://0.0.0.0:80
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - COOKIE_SECURE=false
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  budget-storage:
