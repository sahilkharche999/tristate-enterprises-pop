server {
    listen       80;
    server_name  _;
    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    root   /usr/share/nginx/html;
    index  index.html;

    # Use Docker's internal DNS resolver so 'backend' hostname resolves
    resolver 127.0.0.11 valid=30s;

    # Disable browser caching in the local Docker-served app so rebuilt bundles
    # are picked up immediately instead of being reused via 304 responses.
    etag off;
    if_modified_since off;

    # ── API reverse proxy ──────────────────────────────────────────────────────
    # Forward all backend API paths to the backend container.
    # This avoids CORS issues and cookie problems since the browser
    # always talks to port 80 (same origin).
    location ~ ^/(auth|hoa|macros|ai|api|app-settings|healthz|readyz|docs|openapi.json) {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Forward cookies through (required for JWT auth)
        proxy_pass_header  Set-Cookie;
        proxy_cookie_path  / /;
    }

    location /assets/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
